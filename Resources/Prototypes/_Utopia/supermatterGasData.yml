## COOL REACTIONS
- type: supermatterReaction
  id: SmReactionCarbonDioxide
  composition:
    CarbonDioxide: 1
  tolerance: 0.05
  modifiersVector: "1, 1, 1, 1"
  effects:
  - !type:SupermatterConsumeGasEffect
    gas: CarbonDioxide

- type: supermatterReaction
  id: SmReactionNobliums
  composition:
    HyperNoblium: 1
    AntiNoblium: 1
  tolerance: 0.05
  effects:
  - !type:SupermatterCascadeEffect
    gasFirst: AntiNoblium
    gasSecond: HyperNoblium


# debug
