- type: entity
  categories: [ HideSpawnMenu ]
  id: ActionGeneticFireball
  name: fire breath
  components:
  - type: Action
    useDelay: 10
    itemIconStyle: BigAction
    raiseOnUser: true
    sound: !type:SoundPathSpecifier
      path: /Audio/Magic/fireball.ogg
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: fireball
  - type: TargetAction
    checkCanAccess: false
    range: 60
  - type: WorldTargetAction
    event: !type:ProjectileSpellEvent
      prototype: UtopiaProjectileWeakFireball

- type: entity
  categories: [ HideSpawnMenu ]
  id: ActionAdrenalineRush
  name: Adrenaline Rush
  description: Triggers a powerful surge of adrenaline.
  components:
  - type: Action
    useDelay: 60
  - type: Sprite
    sprite: Objects/Misc/books.rsi
    layers:
    - state: icon_lightning
  - type: InstantAction
    event: !type:AdrenalineRushActionEvent

- type: entity
  categories: [ HideSpawnMenu ]
  id: ActionGeneticIceball
  name: Cryokinesis
  description: Fire a bolt of ice from your fingertips.
  components:
  - type: Action
    useDelay: 30
    itemIconStyle: BigAction
    sound: !type:SoundPathSpecifier
      path: /Audio/Weapons/bladeslice.ogg
    raiseOnUser: true
  - type: Sprite
    sprite: Structures/Specific/Anomalies/ice_anom.rsi
    layers:
    - state: bullet
  - type: TargetAction
    checkCanAccess: false
    range: 60
  - type: WorldTargetAction
    event: !type:ProjectileSpellEvent
      prototype: ProjectileIcicle

- type: entity
  categories: [ HideSpawnMenu ]
  id: ActionInkSpurt
  name: Ink Spurt
  description: Spurt a puddle of slippery black ink behind you.
  components:
  - type: Action
    useDelay: 45
  - type: Sprite
    sprite: Objects/Misc/pens.rsi
    layers:
    - state: pen_centcom
  - type: InstantAction
    event: !type:InkSpurtActionEvent

- type: entity
  categories: [ HideSpawnMenu ]
  id: ActionOpticBlast
  name: Optic Blast
  components:
  - type: Action
    useDelay: 8
    itemIconStyle: BigAction
    raiseOnUser: true
    sound: !type:SoundPathSpecifier
      path: /Audio/Weapons/Guns/Gunshots/laser3.ogg
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
    layers:
    - state: bolt
  - type: TargetAction
    range: 60
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:OpticBlastActionEvent
