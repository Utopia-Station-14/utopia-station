- type: entity
  abstract: true
  parent: ClothingHandsBase
  id: ClothingHandsMittenBase
  components:
  - type: Sprite
    sprite: _Utopia/Clothing/Hands/Gloves/mittens.rsi
    layers:
    - state: icon
  - type: Fiber
    fiberMaterial: fibers-wool
  - type: TemperatureProtection
    heatingCoefficient: 1.0
    coolingCoefficient: 0.90


# White
- type: entity
  parent: ClothingHandsMittenBase
  id: ClothingHandsMittenWhite
  name: white mitten
  description: Regular white gloves that do not keep you from frying.
  components:
  - type: Sprite
    layers:
    - state: icon
      color: "#EAE8E8"
  - type: Clothing
    clothingVisuals:
      gloves:
      - state: equipped-HAND
        color: "#EAE8E8"
  - type: Fiber
    fiberColor: fibers-white

