- type: entity
  abstract: true
  parent: [ TemperatureProtection, ClothingHandsBase ]
  id: ClothingHandsMittenBase
  components:
  - type: Sprite
    sprite: _Utopia/Clothing/Hands/Gloves/mittens.rsi
    layers:
    - state: icon
    - state: wool
  - type: Armor
    modifiers:
      coefficients:
        Cold: 0.9
  - type: Fiber
    fiberMaterial: fibers-wool

# White
- type: entity
  parent: ClothingHandsMittenBase
  id: ClothingHandsMittenWhite
  name: white mitten
  description: Regular white gloves that do not keep you from frying.
  components:
  - type: Sprite
    layers:
    - state: icon
      color: "#EAE8E8"
    - state: wool
  - type: Clothing
    clothingVisuals:
      gloves:
      - state: equipped-HAND
        color: "#EAE8E8"
      - state: equipped-HAND-wool
  - type: Fiber
    fiberColor: fibers-white

