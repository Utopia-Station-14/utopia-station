- type: entity
  abstract: true
  id: ZLevelStairBase
  parent: Stairs
  components:
  - type: Physics
    bodyType: Static
  - type: CEZLevelHighGround
    heightCurve:
    - 1.05
    - 1.05
    - 1.05
    - 0.5
    - 0.1
    stick: true
  - type: Fixtures
    fixtures:
      hard:
        shape:
          !type:PhysShapeAabb
          bounds: "1.6,0.4,1.7,0.5"
        layer:
          - SlipLayer
        mask:
          - ItemMask
        density: 1000
        hard: false
      slowdown:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.5,-0.4,1.5,0.4"
        layer:
          - SlipLayer
        mask:
          - ItemMask
        density: 1000
        hard: false

- type: entity
  id: ZLevelStairs
  parent: ZLevelStairBase
  suffix: Steel

- type: entity
  id: ZLevelStairStage
  parent: ZLevelStairBase
  suffix: Steel, stage
  components:
  - type: Sprite
    sprite: Structures/stairs.rsi
    state: stairs_stage_steel
    drawdepth: FloorTiles

