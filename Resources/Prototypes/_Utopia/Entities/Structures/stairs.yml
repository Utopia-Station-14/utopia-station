- type: entity
  abstract: true
  id: ZLevelStairBase
  parent: Stairs
  components:
  - type: UtopiaStairs
  - type: Fixtures
    fixtures:
      trigger:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,0.44,0.49,0.49"
        layer:
        - MobLayer
        mask:
        - MobMask
        density: 1000
        hard: false

- type: entity
  id: ZLevelStairs
  parent: ZLevelStairBase
  suffix: Steel

- type: entity
  id: ZLevelStairStage
  parent: ZLevelStairBase
  suffix: Steel, stage
  components:
  - type: Sprite
    sprite: Structures/stairs.rsi
    state: stairs_stage_steel
    drawdepth: FloorTiles

- type: entity
  id: ZLevelStairWhite
