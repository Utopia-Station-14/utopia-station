- type: entity
  id: UtopiaMeteorRockCopper
  parent: MeteorRock
  description: An ore vein rich with copper.
  suffix: Copper
  components:
  - type: OreVein
    oreChance: 1.0
    currentOre: UtopiaOreCopper
  - type: Icon
    sprite: Structures/Walls/rock.rsi
  - type: Sprite
    sprite: Structures/Walls/rock.rsi
    layers:
      - state: rock_asteroid
      - map: [ "enum.EdgeLayer.South" ]
        state: rock_asteroid_south
      - map: [ "enum.EdgeLayer.East" ]
        state: rock_asteroid_east
      - map: [ "enum.EdgeLayer.North" ]
        state: rock_asteroid_north
      - map: [ "enum.EdgeLayer.West" ]
        state: rock_asteroid_west
      - state: rock_copper

