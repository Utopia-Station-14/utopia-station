- type: entity
  abstract: true
  id: UtopiaBaseVeinCopper
  suffix: Copper
  description: An ore vein rich with copper.
  components:
  - type: OreVein
    oreChance: 1.0
    currentOre: UtopiaOreCopper
  - type: Sprite
    layers:
    - state: rock_copper
      sprite: Structures/Walls/stone-ore.rsi
      map: [ "enum.MiningScannerVisualLayers.Overlay" ]

