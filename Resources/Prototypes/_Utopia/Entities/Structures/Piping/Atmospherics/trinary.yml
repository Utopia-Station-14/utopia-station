- type: entity
  parent: GasBinaryBase
  id: GasValveThreeWay
  name: three-way valve
  description: A T-junction with a valve that switches the flow between the straight and the side path.
  components:
    - type: Sprite
      sprite: Structures/Piping/Atmospherics/pump.rsi
      layers:
        - sprite: Structures/Piping/Atmospherics/pipe.rsi
          state: pipeTJunction
          map: [ "enum.PipeVisualLayers.Pipe" ]
        - state: pumpManualValve
          map: [ "enum.SubfloorLayers.FirstLayer", "enabled" ]
    - type: Appearance
    - type: AtmosPipeLayers
      pipeLayersLocked: true
    - type: PipeColorVisuals
    - type: GasValve
      kind: ThreeWay
      inlet: inlet
      outlet: outlet
      sideName: side
    - type: NodeContainer
      nodes:
        inlet:
          !type:PipeNode
          nodeGroupID: Pipe
          pipeDirection: South
          volume: 100
        outlet:
          !type:PipeNode
          nodeGroupID: Pipe
          pipeDirection: East
          volume: 100
        side:
          !type:PipeNode
          nodeGroupID: Pipe
          pipeDirection: West
          volume: 100
    - type: GenericVisualizer
      visuals:
        enum.FilterVisuals.Enabled:
          enabled:
            True: { state: pumpManualValveOn }
            False: { state: pumpManualValve }
    - type: AmbientSound
      enabled: true
      volume: -9
      range: 5
      sound:
        path: /Audio/Ambience/Objects/gas_hiss.ogg
    - type: AtmosMonitoringConsoleDevice
      navMapBlip: GasValve
    - type: GuideHelp
      guides:
      - ManualValve
