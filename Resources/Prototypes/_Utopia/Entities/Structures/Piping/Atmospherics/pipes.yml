- type: entity
  parent: GasPipeSansLayers
  id: UtopiaGasZPipeMulti
  name: multi-level pipe
  description: A vertical pipe junction that carries three pipe layers up and down between levels.
  placement:
    mode: AlignAtmosPipeLayers
  components:
  - type: NodeContainer
    nodes:
      pipeLayer1:
        !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: Longitudinal
        pipeLayer: Secondary
      pipeLayer2:
        !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: Longitudinal
        pipeLayer: Primary
      pipeLayer3:
        !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: Longitudinal
        pipeLayer: Tertiary
      zUp1:
        !type:ZPipeNode
        nodeGroupID: Pipe
        pipeDirection: Longitudinal
        zDirection: Up
        pipeLayer: Secondary
      zDown1:
        !type:ZPipeNode
        nodeGroupID: Pipe
        pipeDirection: Longitudinal
        zDirection: Down
        pipeLayer: Secondary
      zUp2:
        !type:ZPipeNode
        nodeGroupID: Pipe
        pipeDirection: Longitudinal
        zDirection: Up
        pipeLayer: Primary
      zDown2:
        !type:ZPipeNode
        nodeGroupID: Pipe
        pipeDirection: Longitudinal
        zDirection: Down
        pipeLayer: Primary
      zUp3:
        !type:ZPipeNode
        nodeGroupID: Pipe
        pipeDirection: Longitudinal
        zDirection: Up
        pipeLayer: Tertiary
      zDown3:
        !type:ZPipeNode
        nodeGroupID: Pipe
        pipeDirection: Longitudinal
        zDirection: Down
        pipeLayer: Tertiary
  - type: ZPipe
  - type: ZLevelTransmitter
    allowUp: true
    allowDown: true
  - type: ZLevelEntityLink
  - type: AtmosDevice
  - type: Sprite
    sprite: _Utopia/Structures/Piping/Atmospherics/zmanifold.rsi
    drawdepth: ThinPipe
    visible: false
    layers:
    - state: zmanifold
      map: [ "enum.PipeVisualLayers.Pipe" ]
  - type: Construction
    graph: UtopiaZPipeMulti
    node: zpipemulti
