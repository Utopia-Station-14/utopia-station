- type: entity
  parent: GasValve
  id: GasValveFourWay
  name: four-way valve
  description: A four-way junction with a valve that switches the flow between two corner paths.
  components:
    - type: Sprite
      sprite: Structures/Piping/Atmospherics/pump.rsi
      layers:
        - sprite: Structures/Piping/Atmospherics/pipe.rsi
          state: pipeFourway
          map: [ "enum.PipeVisualLayers.Pipe" ]
        - state: pumpManualValve
          map: [ "enum.SubfloorLayers.FirstLayer", "enabled" ]
    - type: AtmosPipeLayers
      alternativePrototypes:
        Primary: GasValveFourWay
        Secondary: GasValveFourWay
        Tertiary: GasValveFourWay
    - type: GasValve
      kind: FourWay
      inletName: inlet
      outletName: outlet
      inletBName: inletB
      outletBName: outletB
    - type: NodeContainer
      nodes:
        inlet:
          !type:PipeNode
          nodeGroupID: Pipe
          pipeDirection: North
          volume: 100
        outlet:
          !type:PipeNode
          nodeGroupID: Pipe
          pipeDirection: East
          volume: 100
        inletB:
          !type:PipeNode
          nodeGroupID: Pipe
          pipeDirection: West
          volume: 100
        outletB:
          !type:PipeNode
          nodeGroupID: Pipe
          pipeDirection: South
          volume: 100
