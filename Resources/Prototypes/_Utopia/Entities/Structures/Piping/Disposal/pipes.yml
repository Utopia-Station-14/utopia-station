- type: entity
  id: UtopiaZDisposalPipeUp
  parent: DisposalPipe
  name: vertical disposal pipe
  description: A pipe that sends disposal holders to the Z-level above.
  suffix: up
  components:
  - type: Sprite
    layers:
    - map: [ "pipe" ]
      state: conpipe-up
  - type: DisposalTube
    exits:
    - South
  - type: ZDisposalPipe
    zDirection: Up
  - type: GenericVisualizer
    visuals:
      enum.AnchorVisuals.Anchored:
        pipe:
          False: { state: conpipe-up }
          True: { state: conpipe-up }

- type: entity
  id: UtopiaZDisposalPipeDown
  parent: DisposalPipe
  name: vertical disposal pipe
  description: A pipe that sends disposal holders to the Z-level below.
  suffix: down
  components:
  - type: Sprite
    layers:
    - map: [ "pipe" ]
      state: conpipe-down
  - type: DisposalTube
    exits:
    - South
  - type: ZDisposalPipe
    zDirection: Down
  - type: GenericVisualizer
    visuals:
      enum.AnchorVisuals.Anchored:
        pipe:
          False: { state: conpipe-down }
          True: { state: conpipe-down }
