- type: entity
  parent: GasCanister
  id: UtopiaBZCanister
  components:
    - type: Sprite
      layers:
      - state: BZ
      - state: paper
        visible: false
        map: [ "enum.PaperLabelVisuals.Layer" ]
      - state: integrity-unshaded-0
        map: [ "enum.MaxPressureVisualLayers.BaseUnshaded" ]
        shader: unshaded
        visible: false
      - state: mask-BZ
        map: [ "enum.MaxPressureVisualLayers.Base" ]
        visible: false
    - type: MaxPressureVisuals
      integrityMask: mask-BZ
    - type: GasCanister
      air:
        volume: 1000
        moles:
          BZ: 1871.71051 # BZ
        temperature: 293.15
    - type: Destructible
      thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 300
        behaviors:
        - !type:PlaySoundBehavior
          sound:
            collection: MetalBreak
        - !type:SpawnEntitiesBehavior
          spawn:
            UtopiaBZCanisterBroken:
              min: 1
              max: 1
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
        - !type:DumpCanisterBehavior
    - type: Lock
      locked: true

