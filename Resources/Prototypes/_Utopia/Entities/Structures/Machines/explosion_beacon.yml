- type: entity
  id: MachineExplosionBeacon
  parent: [ BaseMachinePowered, SmallConstructibleMachine ]
  name: explosion beacon
  description: Measures nearby explosions and reports parameters to a linked console.
  components:
  - type: Sprite
    noRot: true
    sprite: Structures/Machines/rndpointsource.rsi
    state: rndpointsource-icon
  - type: Physics
    bodyType: Static
  - type: Transform
    anchored: true
  - type: ApcPowerReceiver
    powerLoad: 50
  - type: PowerState
    idlePowerDraw: 50
    workingPowerDraw: 500
  - type: ExplosionBeacon
  - type: DeviceNetwork
    deviceNetId: Wired
  - type: DeviceList
  - type: DeviceLinkSink
    ports:
      - ExplosionBeaconReceiver
  - type: PointLight
    radius: 1.2
    energy: 2.5
    color: "#e67e22"
