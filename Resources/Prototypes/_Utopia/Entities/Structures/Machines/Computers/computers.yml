- type: entity
  parent: BaseComputer
  id: UtopiaComputerSalary
  name: salary console
  description: Used to pay salaries to station employees.
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerKeys"]
      state: generic_keys
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
    - map: ["computerLayerScreen"]
      sprite: _Utopia/Structures/Machines/computers.rsi
      state: salary
  - type: Computer
    board: UtopiaComputerSalaryCircuitboard
  - type: ActivatableUI
    key: enum.SalaryConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.SalaryConsoleUiKey.Key:
        type: SalaryConsoleBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: SalaryConsole
  - type: ItemSlots
    slots:
      BankCardSlot:
        whitelist:
          tags:
          - UtopiaDepartamentCard
  - type: ContainerContainer
    containers:
      BankCardSlot: !type:ContainerSlot
      board: !type:Container

- type: entity
  parent: BaseComputerAiAccess
  id: UtopiaComputerEconomicRecords
  name: economic records computer
  description: Shows crew economic records.
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerKeys"]
      state: generic_keys
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
    - map: ["computerLayerScreen"]
      sprite: _Utopia/Structures/Machines/computers.rsi
      state: accounts
  - type: Computer
    board: UtopiaComputerEconomicRecordsCircuitboard
  - type: ActivatableUI
    key: enum.EconomicRecordsConsoleKey.Key
  - type: UserInterface
    interfaces:
      enum.EconomicRecordsConsoleKey.Key:
        type: EconomicRecordsConsoleBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: EconomicRecordsConsole
  - type: AccessReader
    access: [ [ "Captain" ], [ "HeadOfPersonnel" ] ]

- type: entity
  parent: BaseComputerAiAccess
  id: UtopiaComputerDnaManipulator
  name: geneticists console
  description: A console used with the medical scanner for DNA research.
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: dna
    - map: ["computerLayerKeys"]
      state: med_key
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: Computer
    board: UtopiaDnaManipulatorConsoleCircuitboard
  - type: ActivatableUI
    singleUser: true
    key: enum.DnaScannerConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.DnaScannerConsoleUiKey.Key:
        type: GeneticistsConsoleBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: DeviceLinkSource
    range: 4
    ports:
      - DnaConsole
  - type: ResearchPointSource
    pointspersecond: 0
    active: true
  - type: ResearchClient
  - type: DnaScannerConsole
  # - type: GuideHelp
  #   guides:
  #   - Genetics
  - type: Tag
    tags:
    - AccessBreakerImmune

- type: entity
  parent: [ BaseComputerAiAccess, BaseEngineeringContraband ]
  id: UtopiaComputerTurbine
  name: turbine monitoring console
  description: Used to monitor the status of turbines.
  components:
    - type: Computer
      board: UtopiaComputerTurbineCircuitboard
    - type: Sprite
      layers:
        - map: ["computerLayerBody"]
          state: computer
        - map: ["computerLayerKeyboard"]
          state: generic_keyboard
        - map: ["computerLayerScreen"]
          state: turbinecomp
        - map: ["computerLayerKeys"]
          state: atmos_key
        - map: ["enum.WiresVisualLayers.MaintenancePanel"]
          state: generic_panel_open
    - type: GenericVisualizer
      visuals:
        enum.ComputerVisuals.Powered:
          computerLayerScreen:
            True: { visible: true, shader: unshaded }
            False: { visible: false }
          computerLayerKeys:
            True: { visible: true, shader: unshaded }
            False: { visible: true, shader: shaded }
        enum.TurbineConsoleVisuals.ComputerLayerScreen:
          computerLayerScreen:
            0: { state: alert-0 }
            1: { state: alert-0 }
            2: { state: alert-1 }
            3: { state: alert-2 }
            4: { state: alert-2 }
    - type: TurbineConsole
    - type: ActivatableUI
      key: enum.TurbineConsoleUiKey.Key
    - type: UserInterface
      interfaces:
        enum.TurbineConsoleUiKey.Key:
          type: TurbineConsoleBoundUserInterface
        enum.WiresUiKey.Key:
          type: WiresBoundUserInterface

- type: entity
  parent: BaseComputerAiAccess
  id: UtopiaComputerShiftSchedule
  name: shift schedule console
  description: A console for setting timed announcements during the schift.
  components:
  - type: Computer
    board: UtopiaComputerShiftScheduleCircuitboard
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: comm
    - map: ["computerLayerKeys"]
      state: generic_keys
    - map: ["enum.WiresVisualLayers.MaintenancePanel"]
      state: generic_panel_open
  - type: AccessReader
    access: [["Captain"]]
  - type: ShiftScheduleConsole
  - type: ActivatableUI
    key: enum.ShiftScheduleConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.ShiftScheduleConsoleUiKey.Key:
        type: ShiftScheduleConsoleBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: ItemSlots
    slots:
      card:
        whitelist:
          tags:
          - UtopiaShiftScheduleCard
  - type: ContainerContainer
    containers:
      card: !type:ContainerSlot
      board: !type:Container
