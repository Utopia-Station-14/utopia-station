- type: entity
  parent: BaseComputer
  id: UtopiaComputerSalary
  name: salary console
  description: Used to pay salaries to station employees.
  components:
  - type: Computer
    board: UtopiaComputerSalaryCircuitboard
  - type: ComputerVisuals
    stateScreen: salary
  - type: ActivatableUI
    key: enum.SalaryConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.SalaryConsoleUiKey.Key:
        type: SalaryConsoleBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: SalaryConsole
  - type: ItemSlots
    slots:
      depcard:
        whitelist:
          tags:
          - UtopiaDepartamentCard
  - type: ContainerContainer
    containers:
      depcard: !type:ContainerSlot
      board: !type:Container

- type: entity
  parent: BaseComputerAiAccess
  id: UtopiaComputerEconomicRecords
  name: economic records computer
  description: Shows crew economic records.
  components:
  - type: Computer
    board: UtopiaComputerEconomicRecordsCircuitboard
  - type: ComputerVisuals
    stateScreen: accounts
  - type: ActivatableUI
    key: enum.EconomicRecordsConsoleKey.Key
  - type: UserInterface
    interfaces:
      enum.EconomicRecordsConsoleKey.Key:
        type: EconomicRecordsConsoleBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: EconomicRecordsConsole
  - type: AccessReader
    access: [ [ "Captain" ], [ "HeadOfPersonnel" ] ]

- type: entity
  parent: BaseComputerAiAccess
  id: UtopiaComputerDnaManipulator
  name: geneticists console
  description: A console used with the medical scanner for DNA research.
  components:
  - type: Computer
    board: UtopiaDnaManipulatorConsoleCircuitboard
  - type: ComputerVisuals
    stateScreen: dna
    stateKeys: med_key
  - type: ActivatableUI
    singleUser: true
    key: enum.DnaScannerConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.DnaScannerConsoleUiKey.Key:
        type: GeneticistsConsoleBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: DeviceLinkSource
    range: 4
    ports:
      - DnaConsole
  - type: ResearchPointSource
    pointspersecond: 0
    active: true
  - type: ResearchClient
  - type: DnaScannerConsole
  # - type: GuideHelp
  #   guides:
  #   - Genetics
  - type: Tag
    tags:
    - AccessBreakerImmune

- type: entity
  parent: [ BaseComputerAiAccess, BaseEngineeringContraband ]
  id: UtopiaComputerTurbine
  name: turbine monitoring console
  description: Used to monitor the status of turbines.
  components:
    - type: Computer
      board: UtopiaComputerTurbineCircuitboard
    - type: ComputerVisuals
      stateScreen: turbinecomp
      stateKeys: atmos_key
    - type: GenericVisualizer
      visuals:
        enum.ComputerVisuals.Powered:
          computerLayerScreen:
            True: { visible: true, shader: unshaded }
            False: { visible: false }
          computerLayerKeys:
            True: { visible: true, shader: unshaded }
            False: { visible: true, shader: shaded }
        enum.TurbineConsoleVisuals.ComputerLayerScreen:
          computerLayerScreen:
            0: { state: alert-0 }
            1: { state: alert-0 }
            2: { state: alert-1 }
            3: { state: alert-2 }
            4: { state: alert-2 }
    - type: TurbineConsole
    - type: ActivatableUI
      key: enum.TurbineConsoleUiKey.Key
    - type: UserInterface
      interfaces:
        enum.TurbineConsoleUiKey.Key:
          type: TurbineConsoleBoundUserInterface
        enum.WiresUiKey.Key:
          type: WiresBoundUserInterface

- type: entity
  id: ComputerExplosionBeaconConsole
  parent: BaseComputerAiAccess
  name: explosion beacon console
  description: Displays target explosion parameters from a linked explosion beacon. Link with a multitool.
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: artifact
    - map: ["computerLayerKeys"]
      state: tech_key
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: ComputerVisuals
    stateScreen: artifact
    stateKeys: tech_key
  - type: ExplosionBeaconConsole
  - type: DeviceList
  - type: DeviceNetwork
    deviceNetId: Wired
  - type: DeviceLinkSource
    range: 65
    ports:
      - ExplosionBeaconConsoleSender
  - type: ActivatableUI
    key: enum.ExplosionBeaconConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.ExplosionBeaconConsoleUiKey.Key:
        type: ExplosionBeaconConsoleBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: ApcPowerReceiver
    powerLoad: 50
  - type: PowerState
    idlePowerDraw: 50
    workingPowerDraw: 300
  - type: AccessReader
    access: [["Research"]]
  - type: PointLight
    radius: 1.5
    energy: 3.0
    color: "#e67e22"


- type: entity
  parent: BaseComputerAiAccess
  id: UtopiaComputerShiftSchedule
  name: shift schedule console
  description: A console for setting timed announcements during the schift.
  components:
  - type: Computer
    board: UtopiaComputerShiftScheduleCircuitboard
  - type: ComputerVisuals
    stateScreen: comm
  - type: AccessReader
    access: [ [ "Captain" ], [ "HeadOfPersonnel" ] ]
  - type: ShiftScheduleConsole
  - type: ActivatableUI
    key: enum.ShiftScheduleConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.ShiftScheduleConsoleUiKey.Key:
        type: ShiftScheduleConsoleBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: ItemSlots
    slots:
      card:
        whitelist:
          tags:
          - UtopiaShiftScheduleCard
  - type: ContainerContainer
    containers:
      card: !type:ContainerSlot
      board: !type:Container
