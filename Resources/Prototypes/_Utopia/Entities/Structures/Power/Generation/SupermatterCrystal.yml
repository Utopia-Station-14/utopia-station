- type: entity
  parent: [ BaseComputerAiAccess, BaseEngineeringContraband ]
  id: SupermatterConsole
  name: supermatter monitoring console
  description: Used to monitor supermatter crystals.
  components:
    - type: Computer
      board: SpaceVillainArcadeComputerCircuitboard
    - type: Sprite
      layers:
        - map: ["computerLayerBody"]
          state: computer
        - map: ["computerLayerKeyboard"]
          state: generic_keyboard
        - map: ["computerLayerScreen"]
          state: alert-0
        - map: ["computerLayerKeys"]
          state: atmos_key
        - map: ["enum.WiresVisualLayers.MaintenancePanel"]
          state: generic_panel_open
    - type: GenericVisualizer
      visuals:
        enum.ComputerVisuals.Powered:
          computerLayerScreen:
            True: { visible: true, shader: unshaded }
            False: { visible: false }
          computerLayerKeys:
            True: { visible: true, shader: unshaded }
            False: { visible: true, shader: shaded }
    - type: SupermatterConsole
    - type: ActivatableUI
      key: enum.SupermatterConsoleUiKey.Key
    - type: UserInterface
      interfaces:
          enum.SupermatterConsoleUiKey.Key:
              type: SupermatterConsoleBoundUserInterface
          enum.WiresUiKey.Key:
            type: WiresBoundUserInterface


- type: edgeSpreader
  id: SupermatterGrowth
  updatesPerSecond: 16
  preventSpreadOnSpaced: false

- type: entity
  id: SupermatterBlob
  components:
  - type: Sprite
    sprite: _Utopia/Objects/Misc/supermatter_kudzu.rsi
    state: kudzu_11
    drawdepth: Mobs
  - type: Appearance
  - type: Transform
    anchored: true
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        hard: false
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        layer:
        - MidImpassable
  - type: ActiveEdgeSpreader
  - type: SupermatterEating
  - type: SupermatterSpreader
  - type: EdgeSpreader
    id: MetalFoam

- type: entity
  parent: BaseItem
  id: SupermatterShard
  name: SupermatterShard
  description:
  components:
    - type: PointLight
      enabled: true
      radius: 3
      energy: 2
      color: "#fff633"
    - type: RadiationSource
      intensity: .75
    - type: Icon
      sprite: _Utopia/Objects/Misc/supermatter_shard.rsi
      state: shard
    - type: Sprite
      sprite: _Utopia/Objects/Misc/supermatter_shard.rsi
      state: shard
    - type: Tag
      tags:
        - HighRiskItem
    - type: SupermatterProtection

- type: entity
  parent: BaseItem
  id: UtopiaStabilizerCore
  name: hyper-Noblium Core
  description: SPEEED SPEEED SPEEED HELL YEAAA :eagle:!!!!
  components:
  - type: Item
    sprite: _Utopia/Objects/Misc/supermatter_stabilizer.rsi
    state: stabilizer
