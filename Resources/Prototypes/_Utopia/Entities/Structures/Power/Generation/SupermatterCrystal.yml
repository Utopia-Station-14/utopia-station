- type: entity
  abstract: true
  id: BaseSupermatter
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _Utopia/Structures/Power/Supermatter/Basic.rsi
    state: supermatter
    drawdepth: Mobs
    snapCardinals: true
    offset: -0.015,0.295
  - type: Icon
    sprite: _Utopia/Structures/Power/Supermatter/Basic.rsi
    state: supermatter
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.4"
        mask:
          - Impassable
          - MidImpassable
          - HighImpassable
          - LowImpassable
          - InteractImpassable
          - Opaque
        layer:
          - MidImpassable
          - HighImpassable
          - BulletImpassable
          - InteractImpassable
  - type: Transform
    anchored: true
    noRot: true
  - type: PointLight
    enabled: true
    radius: 10
    energy: 2
    color: "#ffe000"
  - type: AmbientSound
    range: 20
    volume: -5
    sound:
      path: /Audio/_Utopia/Supermatter/calm.ogg
  # - type: Speech
  #   speechSounds: SupermatterSilent
  #   speechVerb: Supermatter
  #   soundCooldownTime: 0
  #   suffixSpeechVerbs:
  #     chat-speech-verb-suffix-exclamation-strong: Supermatter
  #     chat-speech-verb-suffix-exclamation: Supermatter
  #     chat-speech-verb-suffix-question: Supermatter
  #     chat-speech-verb-suffix-stutter: Supermatter
  #     chat-speech-verb-suffix-mumble: Supermatter
  - type: GuideHelp
    guides: [ SupermatterGuideBook, Power ]
  - type: WarpPoint
    follow: true
    location: supermatter
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
  - type: InteractionPopup ## wtf bro why
    successChance: 0.2
    interactSuccessString: petting-success-supermatter
    interactFailureString: petting-failure-supermatter
    interactSuccessSpawn: EffectHearts

- type: entity
  parent: BaseSupermatter
  id: Supermatter
  name: supermatter crystal
  description: A strangely translucent and iridescent crystal.
  components:
  - type: Appearance
  - type: Sprite
    sprite: _Utopia/Structures/Power/Supermatter/supermatter.rsi
    drawdepth: Ghosts
    snapCardinals: true
    offset: -0.015,0.295
    layers:
    - state: true-platform
      map: ["enum.SupermatterVisualLayers.Base"]
    # - state: shader
    #   sprite: _Utopia/Structures/Power/Supermatter/shader.rsi
    #   shader: shining
    - state: inactive
      map: ["enum.SupermatterVisualLayers.Crystal"]
      shader: unshaded
    - state: glowing-stable
      shader: unshaded
      visible: false
      map: ["enum.SupermatterVisualLayers.Glow"]
    - state: true-outfit
      shader: unshaded
  - type: Explosive
    explosionType: Supermatter
    totalIntensity: 250000
    intensitySlope: 5
    maxIntensity: 100
  - type: GravityWell
    baseRadialAcceleration: 1
    maxRange: 0.5
    gravPulsePeriod: 15
  - type: SinguloFood
    energy: 10000
  - type: Supermatter
    internalEnergy: 200
    externalEnergy: 500
  - type: SupermatterEating
  - type: AtmosDevice
    requireAnchored: false
    joinSystem: true
  - type: RadiationSource
    intensity: 4
  # - type: DeviceLinkSource
  #   ports:
  #   - SupermatterInactive
  #   - SupermatterNormal
  #   - SupermatterCaution
  #   - SupermatterWarning
  #   - SupermatterDanger
  #   - SupermatterEmergency
  #   - SupermatterDelaminating

