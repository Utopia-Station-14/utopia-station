- type: entity
  parent: [ BaseComputerAiAccess, BaseEngineeringContraband ]
  id: ComputerTurbine
  name: turbine monitoring console
  description: Used to monitor the status of turbines.
  components:
    - type: Computer
      board: SpaceVillainArcadeComputerCircuitboard
    - type: Sprite
      layers:
        - map: ["computerLayerBody"]
          state: computer
        - map: ["computerLayerKeyboard"]
          state: generic_keyboard
        - map: ["computerLayerScreen"]
          state: alert-0
        - map: ["computerLayerKeys"]
          state: atmos_key
        - map: ["enum.WiresVisualLayers.MaintenancePanel"]
          state: generic_panel_open
    - type: GenericVisualizer
      visuals:
        enum.ComputerVisuals.Powered:
          computerLayerScreen:
            True: { visible: true, shader: unshaded }
            False: { visible: false }
          computerLayerKeys:
            True: { visible: true, shader: unshaded }
            False: { visible: true, shader: shaded }
        enum.TurbineConsoleVisuals.ComputerLayerScreen:
          computerLayerScreen:
            0: { state: alert-0 }
            1: { state: alert-0 }
            2: { state: alert-1 }
            3: { state: alert-2 }
            4: { state: alert-2 }
    - type: TurbineConsole
    - type: ActivatableUI
      key: enum.TurbineConsoleUiKey.Key
    - type: UserInterface
      interfaces:
          enum.TurbineConsoleUiKey.Key:
              type: TurbineConsoleBoundUserInterface
          enum.WiresUiKey.Key:
            type: WiresBoundUserInterface
