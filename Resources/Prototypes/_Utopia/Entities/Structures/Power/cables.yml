- type: entity
  parent: BaseWallmount
  id: UtopiaZCableWallTerminal
  name: multi-level cable terminal
  description: A wall-mounted terminal that links HV, MV and LV cables to the levels above and below.
  components:
  - type: Sprite
    sprite: _Utopia/Structures/Power/Cables/zcables.rsi
    state: zcables
    drawdepth: WallMountedItems
  - type: Icon
    sprite: _Utopia/Structures/Power/Cables/zcables.rsi
    state: zcables
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 75
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          CableHVStack1:
            min: 1
            max: 1
          CableMVStack1:
            min: 1
            max: 1
          CableApcStack1:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Electrified
    onHandInteract: false
    onInteractUsing: false
    onBump: false
    requirePower: true
    highVoltageNode: hvUp
    mediumVoltageNode: mvUp
    lowVoltageNode: lvUp
  - type: AmbientSound
    enabled: false
    volume: -14
    range: 2
    sound:
      path: /Audio/Ambience/Objects/emf_buzz.ogg
  - type: Cable
    cableDroppedOnCutPrototype: CableHVStack1
    cableType: HighVoltage
  - type: NodeContainer
    nodes:
      hvUp:
        !type:ZCableNode
        nodeGroupID: HVPower
        zDirection: Up
      hvDown:
        !type:ZCableNode
        nodeGroupID: HVPower
        zDirection: Down
      mvUp:
        !type:ZCableNode
        nodeGroupID: MVPower
        zDirection: Up
      mvDown:
        !type:ZCableNode
        nodeGroupID: MVPower
        zDirection: Down
      lvUp:
        !type:ZCableNode
        nodeGroupID: Apc
        zDirection: Up
      lvDown:
        !type:ZCableNode
        nodeGroupID: Apc
        zDirection: Down
  - type: ZCable
  - type: ZLevelTransmitter
    range: 0.9
    allowUp: true
    allowDown: true
  - type: ZLevelEntityLink
  - type: Construction
    graph: UtopiaCableMulti
    node: cablemulti
