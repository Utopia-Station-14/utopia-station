  - type: NodeContainer
    nodes:
      pipe:
        !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: Longitudinal
      zUp:
        !type:ZPipeNode
        nodeGroupID: Pipe
        zDirection: Up
