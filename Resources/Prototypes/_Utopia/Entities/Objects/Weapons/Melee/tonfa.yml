- type: entity
  parent: BaseItem
  id: UtopiaWeaponTonfa
  name: tonfa
  description: Ancient craftwork made with not so ancient plasteel.
  components:
  - type: Sprite
    sprite: _Utopia/Objects/Weapons/Melee/tonfa.rsi
    layers:
    - state: icon-of
      map: [ "icon", "enum.ComboWeaponState.State" ]
  - type: Clothing
    sprite: _Utopia/Objects/Weapons/Melee/tonfa.rsi
    quickEquip: false
    slots:
    - Belt
  - type: Item
    sprite: _Utopia/Objects/Weapons/Melee/tonfa.rsi
    size: Normal
  - type: MeleeWeapon
    wideAnimationRotation: -135
    angle: 10
    attackRate: 2
    damage:
      types:
        Blunt: 5
  - type: DisarmMalus
  - type: ComboWeapon
    swapSound: /Audio/Effects/thudswoosh.ogg
    availableMoves:
      - TonfaHandsDrop
      - TonfaDownedBeat
      - TonfaGrabEscape
      - TonfaStaminaDamage
      - TonfaSlam
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ComboWeaponState.State:
        icon:
          Offensive: {state: icon-of}
          Protective: {state: icon-prot}
  - type: Tag
    tags:
    - SecBeltEquip
