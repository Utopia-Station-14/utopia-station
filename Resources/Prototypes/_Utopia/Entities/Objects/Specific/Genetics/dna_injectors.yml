- type: entity
  abstract: true
  parent: BaseItem
  id: UtopiaBaseDNAInjectorSyringe
  name: DNA injector
  description: A single-use syringe containing a pre-loaded genetic sequence.
  components:
  - type: Sprite
    sprite: _Utopia/Objects/Specific/Medical/dnainjector.rsi
    layers:
      - state: dnainjector-full
  - type: Icon
    sprite: _Utopia/Objects/Specific/Medical/dnainjector.rsi
    state: dnainjector-full
  - type: Item
    size: Tiny
    sprite: _Utopia/Objects/Specific/Medical/dnainjector.rsi
  - type: Appearance
  - type: DnaSequenceInjector
  - type: GuideHelp
    guides:
    - Genetics

- type: entity
  id: UtopiaDNAInjectorEmpty
