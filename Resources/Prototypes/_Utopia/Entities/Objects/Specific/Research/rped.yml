- type: entity
  parent: BaseStorageItem
  id: RPED
  name: RPED
  description: A Rapid Part Exchange Device, perfect for quickly upgrading machines.
  components:
  - type: Sprite
    sprite: _Utopia/Objects/Specific/Research/rped.rsi
    state: icon
  - type: Item
    sprite: _Utopia/Objects/Specific/Research/rped.rsi
    size: Normal
  - type: PartExchanger
  - type: Storage
    grid:
    - 0,0,3,3
    quickInsert: true
    areaInsert: true
    whitelist:
      components:
      - MachinePart
  - type: GuideHelp
    guides:
    - MachineUpgrading

- type: entity
  parent: RPED
  id: BluespaceRPED
  name: bluespace RPED
  description: An upgraded Rapid Part Exchange Device, perfect for remote part replacement and bypassing panel restrictions.
  components:
  - type: Sprite
    sprite: _Utopia/Objects/Specific/Research/bluespace-rped.rsi
    state: icon
  - type: Item
    sprite: _Utopia/Objects/Specific/Research/bluespace-rped.rsi
  - type: PartExchanger
    exchangeDuration: 1.5
    doDistanceCheck: false
    requireOpenPanel: false
    exchangeSound:
      path: /Audio/Effects/teleport_arrival.ogg
    exchangeBeamPrototype: AnomalyTechBeam
  - type: Storage
    grid:
      - 0,0,12,8
